name: CI

on:
  push:
  pull_request:

# Mínimo privilegio: ningún job escribe en el repositorio
permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Base de datos REAL para las pruebas de integración (rotación, seguridad, archivos)
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ClamAV real para las pruebas de antivirus (usan firmas locales, no hace falta descargar la base de datos)
      - run: sudo apt-get update && sudo apt-get install -y clamav-daemon && sudo systemctl stop clamav-daemon clamav-freshclam || true

      - run: npm run lint:security

      # Nada de desarrollo (nodemon, eslint, c8…) en dependencies, en "start" ni en el código servido
      - run: npm run check:prod-deps

      - name: Preparar bases de datos de prueba
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE secure_platform_test CHARACTER SET utf8mb4;
            CREATE DATABASE secure_platform_test_app CHARACTER SET utf8mb4;
            CREATE USER 'sec'@'%' IDENTIFIED BY 'sec_test_pw';
            GRANT ALL ON secure_platform_test.* TO 'sec'@'%';
            GRANT ALL ON secure_platform_test_app.* TO 'sec'@'%';"

      # Un archivo de prueba a la vez: comparten el mismo servidor MariaDB. Se miden con c8 (cobertura) y el umbral mínimo
      # (.c8rc.json → check-coverage) hace fallar el job si baja. Incluye el fuzzing con propiedades (test/test_fuzz.js).
      - name: Pruebas + cobertura (API, sesiones, RBAC, MFA/WebAuthn, SSO/SAML, KMS, archivos, operación, fuzzing)
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Resumen del fallo de las pruebas (anotación)
        if: failure()
        run: grep -E -B2 -A8 "not ok|AssertionError|Error:" "$RUNNER_TEMP/test.log" | head -120 | bash .github/scripts/annotate-log.sh - "pruebas API" 120

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;const row=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+'/'+t[k].total+' |';console.log(['### Cobertura de pruebas','','| Métrica | % | Líneas |','|---|---|---|',row('lines'),row('statements'),row('functions'),row('branches')].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  # Interfaz web de operación (web/): tipos, pruebas unitarias del BFF, compilación y extremo a extremo con el API REAL + Chromium
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci                    # el API real, que usan las pruebas de extremo a extremo
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Compilar
        run: WEB_SESSION_SECRET="$(openssl rand -hex 32)" npm run build
        working-directory: web
        env:
          OPS_API_URL: http://127.0.0.1:3000
      - name: Dependencias de producción de la web sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      # Navegadores reales (Chromium, Firefox y WebKit) y axe-core para la prueba de accesibilidad: con --no-save, no son dependencias del paquete
      - name: Navegadores de Playwright y axe-core
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.1
          npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Base de datos de pruebas
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE secure_platform_test_app CHARACTER SET utf8mb4;
            CREATE USER 'sec'@'%' IDENTIFIED BY 'sec_test_pw';
            GRANT ALL ON secure_platform_test_app.* TO 'sec'@'%';"
      - name: Extremo a extremo (API real + web real + navegador)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        working-directory: web
      - name: Resumen del fallo e2e (anotación)
        if: failure()
        run: grep -E -A30 "not ok" "$RUNNER_TEMP/e2e.log" | grep -vE "^ *(type|duration_ms|failureType|location):" | head -150 | bash .github/scripts/annotate-log.sh - "web e2e" 150

  # Entorno independiente de pruebas de seguridad (PruebasLinux): perfil seguro (repositorio y localhost) como informe, y las
  # comprobaciones de invariantes y Semgrep con reglas propias como puerta (fallan si algo se deshace).
  pruebaslinux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - name: Herramientas (las que falten se omiten y quedan en el informe)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck yamllint jq
          # 1.95 importaba pkg_resources (setuptools), que ya no está en el entorno de pipx del runner: versión actual
          pipx install --force semgrep==1.181.1
          semgrep --version
      - name: Perfil seguro (informe)
        run: ./pruebas.sh --safe-all --no-color --yes || true
        working-directory: PruebasLinux
      - name: Invariantes de seguridad (refresh, SSO, BFF, Dockerfile)
        working-directory: PruebasLinux
        run: |
          ./pruebas.sh --run 119 120 121 124 --no-color --yes | tee invariantes.txt
          if grep -F "[!]" invariantes.txt; then echo "::error::Una comprobación de invariantes ha fallado"; exit 1; fi
      - name: Semgrep con las reglas propias (las de severidad ERROR bloquean)
        run: |
          set -o pipefail
          semgrep scan --metrics=off --error --severity ERROR --config PruebasLinux/rules/semgrep-node.yml src scripts 2>&1 | tee "$RUNNER_TEMP/semgrep.log"
      - name: Resumen del fallo (anotación)
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/semgrep.log" ] && bash .github/scripts/annotate-log.sh "$RUNNER_TEMP/semgrep.log" "semgrep" 60
          [ -f PruebasLinux/logs/latest.log ] && bash .github/scripts/annotate-log.sh PruebasLinux/logs/latest.log "pruebaslinux" 40
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: pruebaslinux, path: PruebasLinux/reports/, retention-days: 14 }

  # Escalabilidad horizontal REAL: 2 réplicas del API (contenedores) detrás de nginx, con MariaDB y SeaweedFS (S3) compartidos.
  # Construye la imagen de producción (Dockerfile) y comprueba reparto, un solo líder, archivos y límites compartidos y SSE.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Secretos efímeros (aleatorios en cada ejecución)
        run: |
          {
            for v in DB_ROOT_PASSWORD DB_PASSWORD BASE_SEED ENCRYPTION_SEED JWT_SEED S3_SECRET_KEY; do echo "$v=$(openssl rand -hex 24)"; done
            echo "S3_ACCESS_KEY=ci-s3"
            echo "API_REPLICAS=2"
            echo "RATE_LIMIT_GLOBAL_PER_MIN=1000000"
          } > deploy/compose.env
      - name: Construir y levantar
        run: |
          set -o pipefail
          { docker version --format 'docker {{.Server.Version}}'; docker compose version; } 2>&1 | tee "$RUNNER_TEMP/compose-up.log"
          docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env up -d --build 2>&1 | tee -a "$RUNNER_TEMP/compose-up.log"
      - name: Varias réplicas
        run: |
          set -o pipefail
          node --test test/test_compose.js 2>&1 | tee "$RUNNER_TEMP/compose-test.log"
        env:
          COMPOSE_ENV_FILE: deploy/compose.env
      - name: Registros si algo falló
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/compose-up.log" ] && bash .github/scripts/annotate-log.sh "$RUNNER_TEMP/compose-up.log" "compose up" 60
          [ -f "$RUNNER_TEMP/compose-test.log" ] && grep -E -A25 "not ok" "$RUNNER_TEMP/compose-test.log" | grep -vE "^ *(type|duration_ms|failureType|location):" | head -120 | bash .github/scripts/annotate-log.sh - "compose pruebas" 120
          docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env ps -a || true
          docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env logs --tail 150
          docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env logs --no-color api 2>&1 | grep -E "❌|⚠️|rror|ERR_|Exception" | tail -60 | bash .github/scripts/annotate-log.sh - "compose api errores" 60
          for s in api mariadb s3 s3-init lb; do
            docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env logs --no-color --tail 40 "$s" 2>&1 | bash .github/scripts/annotate-log.sh - "compose $s" 40
          done
      - name: Apagar
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env down -v

  # Lo que se despliega: instalación SOLO de producción, sin herramientas de desarrollo, y el servidor arranca así
  production-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Sin nodemon ni herramientas de desarrollo en node_modules
        run: node scripts/checkProductionDeps.js --installed
      - name: "'npm run dev' se niega en producción"
        run: |
          if NODE_ENV=production npm run dev; then echo "npm run dev no debería arrancar en producción"; exit 1; fi
      - name: Los módulos del servidor cargan sin dependencias de desarrollo
        run: node -e "for (const m of ['express','helmet','mysql2','sharp','@prometheus-io/client','@aws-sdk/client-s3','@simplewebauthn/server','@node-saml/node-saml']) require(m); console.log('ok')"

  # Pull requests: no se aceptan dependencias nuevas con vulnerabilidades altas ni licencias incompatibles
  # Requiere activar «Dependency graph» (y GitHub Advanced Security si el repositorio es privado) en Settings → Code security.
  # Mientras no esté activo el job informa del error pero NO bloquea (continue-on-error); al activarlo, deja de ser informativo en la práctica.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
