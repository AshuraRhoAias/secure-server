name: CI

on:
  push:
  pull_request:

# Mínimo privilegio: ningún job escribe en el repositorio
permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Base de datos REAL para las pruebas de integración (rotación, seguridad, archivos)
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ClamAV real para las pruebas de antivirus (usan firmas locales, no hace falta descargar la base de datos)
      - run: sudo apt-get update && sudo apt-get install -y clamav-daemon && sudo systemctl stop clamav-daemon clamav-freshclam || true

      - run: npm run lint:security

      # Nada de desarrollo (nodemon, eslint, c8…) en dependencies, en "start" ni en el código servido
      - run: npm run check:prod-deps

      - name: Preparar bases de datos de prueba
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE secure_platform_test CHARACTER SET utf8mb4;
            CREATE DATABASE secure_platform_test_app CHARACTER SET utf8mb4;
            CREATE USER 'sec'@'%' IDENTIFIED BY 'sec_test_pw';
            GRANT ALL ON secure_platform_test.* TO 'sec'@'%';
            GRANT ALL ON secure_platform_test_app.* TO 'sec'@'%';"

      # Un archivo de prueba a la vez: comparten el mismo servidor MariaDB. Se miden con c8 (cobertura) y el umbral mínimo
      # (.c8rc.json → check-coverage) hace fallar el job si baja. Incluye el fuzzing con propiedades (test_fuzz.js).
      - name: Pruebas + cobertura (API, sesiones, RBAC, MFA/WebAuthn, SSO/SAML, KMS, archivos, operación, fuzzing)
        run: npm run coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;const row=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+'/'+t[k].total+' |';console.log(['### Cobertura de pruebas','','| Métrica | % | Líneas |','|---|---|---|',row('lines'),row('statements'),row('functions'),row('branches')].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  # Interfaz web de operación (web/): tipos, pruebas unitarias del BFF, compilación y extremo a extremo con el API REAL + Chromium
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci                    # el API real, que usan las pruebas de extremo a extremo
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Compilar
        run: WEB_SESSION_SECRET="$(openssl rand -hex 32)" npm run build
        working-directory: web
        env:
          OPS_API_URL: http://127.0.0.1:3000
      - name: Dependencias de producción de la web sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Chromium para Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
        working-directory: web
      - name: Base de datos de pruebas
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE secure_platform_test_app CHARACTER SET utf8mb4;
            CREATE USER 'sec'@'%' IDENTIFIED BY 'sec_test_pw';
            GRANT ALL ON secure_platform_test_app.* TO 'sec'@'%';"
      - name: Extremo a extremo (API real + web real + navegador)
        run: npm run test:e2e
        working-directory: web

  # Lo que se despliega: instalación SOLO de producción, sin herramientas de desarrollo, y el servidor arranca así
  production-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Sin nodemon ni herramientas de desarrollo en node_modules
        run: node scripts/checkProductionDeps.js --installed
      - name: "'npm run dev' se niega en producción"
        run: |
          if NODE_ENV=production npm run dev; then echo "npm run dev no debería arrancar en producción"; exit 1; fi
      - name: Los módulos del servidor cargan sin dependencias de desarrollo
        run: node -e "for (const m of ['express','helmet','mysql2','sharp','prom-client','@simplewebauthn/server','@node-saml/node-saml']) require(m); console.log('ok')"

  # Pull requests: no se aceptan dependencias nuevas con vulnerabilidades altas ni licencias incompatibles
  # Requiere activar «Dependency graph» (y GitHub Advanced Security si el repositorio es privado) en Settings → Code security.
  # Mientras no esté activo el job informa del error pero NO bloquea (continue-on-error); al activarlo, deja de ser informativo en la práctica.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
