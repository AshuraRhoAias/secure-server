# Reglas propias de semgrep para secure-server (opción "Semgrep (reglas propias Node/Express)" de PruebasLinux).
# Locales: no necesitan red ni el registro de reglas. Cada una refleja una decisión del proyecto que no debe deshacerse sin querer.
rules:
  - id: jwt-verify-sin-algoritmo
    message: "jwt.verify sin fijar `algorithms`: riesgo de confusión de algoritmo. Usa { algorithms: ['HS256'] }."
    severity: ERROR
    languages: [javascript]
    patterns:
      - pattern: jwt.verify($TOKEN, $KEY)
  - id: sql-con-plantilla
    message: "SQL construido con una plantilla que interpola valores. Usa parámetros `?` (o sqlInt/sqlPlaceholders/sqlFragment)."
    severity: WARNING
    languages: [javascript]
    patterns:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern-not: $DB.query(`...${sqlInt(...)}...`, ...)
      - pattern-not: $DB.query(`...${sqlPlaceholders(...)}...`, ...)
      - pattern-not: $DB.query(`...${sqlFragment(...)}...`, ...)
    paths:
      exclude: [src/maintenance/, src/backup/]
  - id: child-process-exec
    message: "child_process.exec/execSync pasa por una shell. El servidor no lanza procesos (ver test_icmp)."
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: require('child_process').exec(...)
      - pattern: require('child_process').execSync(...)
      # Solo sobre el módulo child_process (un `.exec(` cualquiera, p. ej. de una RegExp, no cuenta)
      - patterns:
          - pattern-inside: |
              const $CP = require('child_process');
              ...
          - pattern-either:
              - pattern: $CP.exec(...)
              - pattern: $CP.execSync(...)
  - id: redireccion-abierta
    message: "res.redirect con un destino que viene de la petición (redirección abierta)."
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: $RES.redirect(req.query.$X)
      - pattern: $RES.redirect($CODE, req.query.$X)
      - pattern: $RES.redirect(req.body.$X)
      - pattern: $RES.redirect($CODE, req.body.$X)
  # WARNING (informativa): hoy solo aparece en usos que NO son secretos (asunto del camuflaje en disguiser.js, muestreo de trazas)
  - id: math-random-en-secretos
    message: "Math.random no es aleatoriedad criptográfica. Usa crypto.randomBytes / randomUUID / randomInt si es un secreto."
    severity: WARNING
    languages: [javascript]
    pattern: Math.random()
    paths:
      include: [src/]
