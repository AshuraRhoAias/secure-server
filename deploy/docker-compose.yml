# Varias réplicas del API detrás de un balanceador, con la base de datos y el almacenamiento de archivos COMPARTIDOS.
# Es el montaje con el que se prueba la escalabilidad horizontal en el CI (job "compose", test_compose.js) y sirve de punto de
# partida para un despliegue. NO es una configuración de producción tal cual: falta TLS (balanceador y BD), secretos en un gestor
# (aquí llegan por variables de entorno) y copias del bucket.
#
#   cp deploy/compose.env.example deploy/compose.env   # y rellena los secretos
#   docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env up -d --build --wait
#   docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env up -d --scale api=4
#
# Piezas:
#   mariadb  estado de seguridad, sesiones, cerrojo de líder: lo comparten todas las réplicas
#   s3       almacenamiento S3 (SeaweedFS) de los archivos cifrados (FILES_STORAGE=s3): cualquier réplica sirve cualquier archivo
#   api      N réplicas (cada una con su cluster de WEB_CONCURRENCY procesos); UNA es líder de las tareas periódicas
#   lb       nginx: reparto, X-Forwarded-For real, SSE sin búfer

name: secure-server

x-api-env: &api-env
  NODE_ENV: production
  TRUST_PROXY: '1'
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_SSL: 'off'                       # red interna de Docker; en producción, TLS hacia la BD (DB_SSL=verify)
  DB_FRAGMENT_1: mysql://secure:${DB_PASSWORD:?define DB_PASSWORD}@
  DB_FRAGMENT_2: mariadb:3306
  DB_FRAGMENT_3: /secure_platform
  BASE_SEED: ${BASE_SEED:?define BASE_SEED}
  ENCRYPTION_SEED: ${ENCRYPTION_SEED:?define ENCRYPTION_SEED}
  JWT_SEED: ${JWT_SEED:?define JWT_SEED}
  KEY_EPOCH: ${KEY_EPOCH:-E00000000T000000Z}
  DISABLE_EMAIL_NOTIFICATIONS: 'true'
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
  FILES_STORAGE: s3
  S3_BUCKET: secure-files
  S3_ENDPOINT: http://s3:8333
  S3_ALLOW_HTTP: 'true'               # red interna; en producción, https
  S3_FORCE_PATH_STYLE: 'true'
  S3_REGION: us-east-1
  # Sin cifrado del lado del servidor del bucket: SeaweedFS no lo tiene configurado aquí y los archivos YA llegan cifrados
  # (AES-256-GCM por bloques). En AWS S3 deja el valor por defecto (AES256) o aws:kms como capa adicional.
  S3_SSE: 'none'
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY}
  HEALTH_EXPOSE_INSTANCE: 'true'
  RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-600}

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD}
      MARIADB_DATABASE: secure_platform
      MARIADB_USER: secure
      MARIADB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  # Almacenamiento S3 de referencia: SeaweedFS (las imágenes de MinIO dejaron de publicarse en Docker Hub en 2025).
  # Las credenciales se escriben al arrancar en un archivo temporal del contenedor (no en la imagen ni en el repositorio).
  s3:
    image: chrislusf/seaweedfs:4.52
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"secure-server","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || nc -z 127.0.0.1 8333 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Crea el bucket (una vez, con reintentos mientras el S3 termina de arrancar) y termina
  s3-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket secure-files 2>/dev/null && exit 0
          aws --endpoint-url http://s3:8333 s3api create-bucket --bucket secure-files && exit 0
          sleep 2
        done
        echo "no se pudo crear el bucket" >&2; exit 1
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1

  api:
    build: { context: .., dockerfile: Dockerfile }
    environment: *api-env
    depends_on:
      mariadb: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    deploy:
      replicas: ${API_REPLICAS:-2}
    read_only: true
    tmpfs:
      - /app/storage:uid=10001,gid=10001,mode=0700
      - /app/data:uid=10001,gid=10001,mode=0700
      - /app/backups:uid=10001,gid=10001,mode=0700
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  lb:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:${LB_PORT:-8080}:8080'

volumes:
  db-data:
  s3-data:
