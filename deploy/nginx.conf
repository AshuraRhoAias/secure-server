# Balanceador delante de varias réplicas del API (docker compose). Lo mínimo para que el reparto sea correcto:
#   - resolución DNS dinámica del servicio "api" (todas sus réplicas, y las que aparezcan al escalar)
#   - X-Forwarded-For con la IP real (el API confía en UN salto: TRUST_PROXY=1)
#   - SSE (/api/system/stream) sin búfer y con tiempo de lectura largo
#   - keepalive hacia el API más corto que el del API (65 s), para no reutilizar conexiones que el API ya cerró
# En producción: TLS aquí (o en el balanceador de la nube), límites de tamaño acordes a UPLOAD_MAX_* y un WAF/CDN delante.
worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker

  upstream api {
    zone api 64k;
    server api:3000 resolve;
    keepalive 64;
    keepalive_timeout 55s;
  }

  server {
    listen 8080;
    client_max_body_size 600m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # se SUSTITUYE (no se añade): el cliente no puede inyectar IPs
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_503;       # réplica cerrándose o en mantenimiento → otra
    proxy_next_upstream_tries 2;

    location = /api/system/stream {
      proxy_pass http://api;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
    location / {
      proxy_pass http://api;
      proxy_request_buffering off;                    # subidas grandes en streaming hasta el API (que cifra al vuelo)
      proxy_read_timeout 120s;
    }
  }
}
